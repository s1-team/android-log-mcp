name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows has not been validated yet (file locking, paths); do not block on it.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...

  npm-pack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build-npm.sh --pack
      - name: smoke test (launcher + linux-x64 binary)
        run: |
          d=$(mktemp -d)
          cd "$d" && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/npm/dist/tarballs/android-log-mcp-linux-x64-*.tgz "$GITHUB_WORKSPACE"/npm/dist/tarballs/android-log-mcp-[0-9]*.tgz
          ./node_modules/.bin/android-log-mcp --version
