name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * *"   # nightly (03:17 Asia/Shanghai): full-size perf on main

permissions:
  contents: read

# A new push to a pull request cancels its older run (issue #25). Every other
# run (push to main, nightly) gets a group of its own: a shared group would
# make main runs wait for each other and cancel a pending one when a third
# arrives, even without cancel-in-progress.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...

  # Performance guard (issue #13, docs/performance.md): deterministic metrics
  # (output bytes, allocations, disk bytes per line) strictly, timings and
  # memory generously against perf/baseline.json. Isolated temp dirs and the
  # fake adb only. Pull requests measure a small history (ALM_PERF_COPIES=20)
  # against perf/baseline-pr.json; main and the nightly run the full size
  # (issue #25).
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: scripts/perf.sh --check ${{ github.event_name == 'pull_request' && '--pr' || '' }} --out "$RUNNER_TEMP/perf"
        env:
          ALM_PERF_HOST: github ubuntu-latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: ${{ runner.temp }}/perf
          retention-days: 30

  # Starts at once (no `needs: test`; the test jobs are required checks on
  # their own) and cross-compiles the 6 targets in parallel with a rolling Go
  # build cache (issue #25). The cache is saved only from pushes to main (pull
  # requests restore main's latest), under a key that rotates every ISO week so
  # it cannot grow without bound, and only while it stays under 1.5 GB.
  npm-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - id: gocache
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.gocache.outputs.gocache }}
            ${{ steps.gocache.outputs.gomodcache }}
          key: gobuild-npm-${{ runner.os }}-${{ steps.gocache.outputs.week }}-${{ hashFiles('server/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            gobuild-npm-${{ runner.os }}-${{ steps.gocache.outputs.week }}-${{ hashFiles('server/go.sum') }}-
            gobuild-npm-${{ runner.os }}-${{ steps.gocache.outputs.week }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build-npm.sh --pack
      - name: check the Go cache size
        id: cachesize
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mb=$(du -smc "${{ steps.gocache.outputs.gocache }}" "${{ steps.gocache.outputs.gomodcache }}" | tail -1 | cut -f1)
          echo "Go caches: $mb MB"
          if [ "$mb" -le 1500 ]; then echo "save=true" >> "$GITHUB_OUTPUT"; else echo "::warning::Go cache $mb MB > 1500 MB: not saved"; fi
      - uses: actions/cache/save@v4
        if: steps.cachesize.outputs.save == 'true'
        with:
          path: |
            ${{ steps.gocache.outputs.gocache }}
            ${{ steps.gocache.outputs.gomodcache }}
          key: gobuild-npm-${{ runner.os }}-${{ steps.gocache.outputs.week }}-${{ hashFiles('server/go.sum') }}-${{ github.run_id }}
      - name: smoke test (launcher + linux-x64 binary)
        run: |
          d=$(mktemp -d)
          cd "$d" && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/npm/dist/tarballs/android-log-mcp-linux-x64-*.tgz "$GITHUB_WORKSPACE"/npm/dist/tarballs/android-log-mcp-[0-9]*.tgz
          ./node_modules/.bin/android-log-mcp --version
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: npm/dist/tarballs/*.tgz
          retention-days: 7

  # The npm launcher across Node versions (engines: node >=16) and host OSes:
  # install the packed tarballs, run `npx android-log-mcp --version` and an
  # MCP stdio handshake (initialize, tools/list, logcat_status) with
  # --offline <empty dataset dir> (read-only: no adb, nothing written), then
  # the same through the service process (no adb, linger 0). They need only
  # the tarballs (issue #25). The service process exits after
  # ALM_TEST_EXIT_GRACE=2s here; only ubuntu/node 22 keeps the real 30 s.
  npx-compat:
    needs: npm-pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "16", plat: linux-x64 }
          - { os: ubuntu-latest, node: "18", plat: linux-x64 }
          - { os: ubuntu-latest, node: "20", plat: linux-x64 }
          - { os: ubuntu-latest, node: "22", plat: linux-x64, real_grace: true }
          - { os: ubuntu-latest, node: "lts/*", plat: linux-x64 }
          - { os: ubuntu-latest, node: "current", plat: linux-x64 }
          - { os: macos-latest, node: "22", plat: darwin-arm64 }
          - { os: windows-latest, node: "22", plat: win32-x64 }
    name: npx (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: npm/test
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: tarballs
      - name: install packed packages
        run: |
          node --version && npm --version
          mkdir smoke && cd smoke && npm init -y >/dev/null
          npm install --no-audit --no-fund ../tarballs/android-log-mcp-${{ matrix.plat }}-*.tgz ../tarballs/android-log-mcp-[0-9]*.tgz
      - name: npx --version
        working-directory: smoke
        run: npx android-log-mcp --version
      - name: MCP stdio handshake
        working-directory: smoke
        run: node ../npm/test/mcp_smoke.js npx android-log-mcp --offline "${{ runner.temp }}/alm-offline"
      # the MCP process starts the service process (detached, from a copy
      # under <root>/bin) and forwards the call to it (issue #3)
      - name: MCP stdio handshake through the background service
        working-directory: smoke
        env:
          ANDROID_LOG_MCP_ADB: ${{ runner.temp }}/no-adb   # never start the runner's adb
          ANDROID_LOG_MCP_LINGER: "0"                     # no device would be kept anyway (no adb)
          ALM_TEST_EXIT_GRACE: ${{ !matrix.real_grace && '2s' || '' }}   # '' = the real 30 s
        run: |
          node ../npm/test/mcp_smoke.js npx android-log-mcp | tee smoke.txt
          grep -E "^service: background service pid [0-9]+, version [^,]+, protocol [0-9]+" smoke.txt
          npx android-log-mcp root --json
          # the service process exits ALM_TEST_EXIT_GRACE after the last MCP
          # process with no pin and no recorded device (#11)
          for i in $(seq 1 90); do npx android-log-mcp service status >/dev/null || break; sleep 1; done
          npx android-log-mcp service status && { echo "service process still running 90 s after the last MCP process"; npx android-log-mcp service stop; exit 1; } || true
